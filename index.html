<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البث المباشر</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; }
    .stream-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; }
    /* منع التفاعل بالماوس بالكامل (يسار ويمين) */
    iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
  </style>
</head>
<body oncontextmenu="return false;" mousedown="return false;">
  <div class="stream-container">
    <iframe 
      src="https://www.youtube.com/embed/DlT5JiPBFTM?autoplay=1&mute=0&controls=0&modestbranding=1&rel=0&iv_load_policy=3" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
