<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البث المباشر</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; }
    .stream-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; }
    iframe { width: 100%; height: 100%; border: none; }
    /* طبقة شفافة لمنع الضغط فوق شعار يوتيوب العلوي */
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 60px; z-index: 10; background: transparent; }
  </style>
</head>
<body oncontextmenu="return false;">
  <div class="stream-container">
    <div class="overlay"></div>
    <iframe 
      src="https://www.youtube.com/embed/15zUWprE5WM?autoplay=1&modestbranding=1&autohide=1&showinfo=0&controls=1" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
